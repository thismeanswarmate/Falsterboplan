# Publishes the app to everyone who has it, without an app store.
#
# Run it by hand: GitHub > Actions > "Släpp ny version" > Run workflow.
#
# It builds the APK and uploads it to Firebase App Distribution, which e-mails the
# tester group. The app itself asks App Distribution for newer builds and shows
# "Ny version finns".
#
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT: the JSON key of a Google
# service account that may upload to App Distribution.
name: Släpp ny version

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Vad är nytt? (visas i appen och i mejlet)"
        required: false
        default: ""
      testers:
        description: "Testgrupp i Firebase App Distribution"
        required: false
        default: "hushall"

permissions:
  contents: read

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT: falsterboplan-6b048
      FIREBASE_APP_ID: "1:546450827322:android:f2217ddda46430f32cad03"
      NOTES: ${{ inputs.notes }}
      TESTERS: ${{ inputs.testers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version number is the number of commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testa och bygg
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Skicka till App Distribution
        run: |
          set -euo pipefail
          printf '%s\n' "${NOTES:-Ny version}" > notes.txt
          npx --yes firebase-tools@13 appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" --project "$FIREBASE_PROJECT" \
            --groups "$TESTERS" --release-notes-file notes.txt
